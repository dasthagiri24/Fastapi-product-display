
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store - Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            text-align: center;
            padding: 80px 20px;
            color: #243b53;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 40px 20px;
            background: white;
            border-radius: 12px;

        }

        a:hover {
            background: #06447e;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to the Product Store</h1>

</html>
